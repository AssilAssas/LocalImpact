<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="Architecture Clean Architecture de LocalImpact">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#14B8A6" />
    </marker>
  </defs>

  <rect width="960" height="320" rx="16" fill="url(#archBg)" />
  <rect x="1" y="1" width="958" height="318" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="480" y="34" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">
    Flux Clean Architecture — Séparation stricte des couches
  </text>

  <!-- Layer 1: Presentation (Next.js App Router) -->
  <rect x="36" y="64" width="200" height="216" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
  <text x="136" y="90" text-anchor="middle" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Présentation (Next.js)</text>
  <text x="136" y="116" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11">src/app/ (Pages &amp; API)</text>
  <text x="136" y="138" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11">src/components/</text>
  <rect x="54" y="160" width="164" height="32" rx="6" fill="#1E293B" />
  <text x="136" y="180" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Validation client Zod</text>
  <rect x="54" y="204" width="164" height="32" rx="6" fill="#1E293B" />
  <text x="136" y="224" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Route Handlers minces</text>

  <!-- Layer 2: Application -->
  <rect x="276" y="64" width="200" height="216" rx="12" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5" />
  <text x="376" y="90" text-anchor="middle" fill="#5EEAD4" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Application</text>
  <text x="376" y="116" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11">src/application/</text>
  <rect x="294" y="136" width="164" height="34" rx="6" fill="#1E293B" />
  <text x="376" y="157" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Cas d'usage métier</text>
  <rect x="294" y="180" width="164" height="34" rx="6" fill="#1E293B" />
  <text x="376" y="201" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Schémas Zod partagés</text>
  <rect x="294" y="224" width="164" height="34" rx="6" fill="#1E293B" />
  <text x="376" y="245" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Ports &amp; Interfaces</text>

  <!-- Layer 3: Domain (Pure) -->
  <rect x="516" y="64" width="190" height="216" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2" />
  <text x="611" y="90" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Domaine (Pur TS)</text>
  <text x="611" y="114" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">0 import Next / Prisma</text>
  <rect x="532" y="134" width="158" height="28" rx="6" fill="#1E293B" />
  <text x="611" y="152" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Machine à états</text>
  <rect x="532" y="170" width="158" height="28" rx="6" fill="#1E293B" />
  <text x="611" y="188" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">RBAC &amp; permissions</text>
  <rect x="532" y="206" width="158" height="28" rx="6" fill="#1E293B" />
  <text x="611" y="224" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Scoring similarité</text>
  <rect x="532" y="242" width="158" height="28" rx="6" fill="#1E293B" />
  <text x="611" y="260" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Calcul statistiques</text>

  <!-- Layer 4: Infrastructure -->
  <rect x="744" y="64" width="180" height="216" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
  <text x="834" y="90" text-anchor="middle" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Infrastructure</text>
  <text x="834" y="116" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11">src/infrastructure/</text>
  <rect x="760" y="136" width="148" height="34" rx="6" fill="#1E293B" />
  <text x="834" y="157" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Prisma + PostgreSQL</text>
  <rect x="760" y="180" width="148" height="34" rx="6" fill="#1E293B" />
  <text x="834" y="201" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Session JWT (jose)</text>
  <rect x="760" y="224" width="148" height="34" rx="6" fill="#1E293B" />
  <text x="834" y="245" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">LocalFileStorage</text>

  <!-- Animated connectors -->
  <line x1="236" y1="172" x2="272" y2="172" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="476" y1="172" x2="512" y2="172" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="744" y1="172" x2="708" y2="172" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.2s" repeatCount="indefinite" />
  </line>

  <!-- Moving signal pulse across layers -->
  <circle cy="172" r="4" fill="#5EEAD4">
    <animate attributeName="cx" values="238;274;478;514" dur="2.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite" />
  </circle>
</svg>
