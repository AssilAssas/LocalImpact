services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localimpact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localimpact}
      POSTGRES_DB: ${POSTGRES_DB:-localimpact}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localimpact} -d ${POSTGRES_DB:-localimpact}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localimpact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localimpact}
      POSTGRES_DB: localimpact_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localimpact} -d localimpact_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-localimpact}:${POSTGRES_PASSWORD:-localimpact}@db:5432/${POSTGRES_DB:-localimpact}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-localimpact-dev-secret-change-in-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
